<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço - OS Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1f2937;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 24px 20px 16px;
            border-bottom: 1px solid #374151;
        }

        .sidebar-brand h4 {
            color: #fff;
            font-weight: 700;
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .sidebar-brand small {
            color: #9ca3af;
            font-size: 0.72rem;
        }

        .sidebar nav {
            flex: 1;
            padding: 12px 0;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .sidebar a i {
            font-size: 1rem;
            width: 18px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #374151;
        }

        .sidebar-footer a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-footer a:hover {
            color: #ef4444;
        }

        /* CONTENT */
        .content {
            margin-left: 240px;
            padding: 28px 32px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-header h3 {
            font-weight: 700;
            color: #111827;
            margin: 0;
            font-size: 1.4rem;
        }

        /* BADGE DE STATUS */
        .badge-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-ABERTA          { background: #dbeafe; color: #1d4ed8; }
        .status-EM_ANALISE      { background: #fef9c3; color: #854d0e; }
        .status-AGUARDANDO_PECA { background: #ffedd5; color: #c2410c; }
        .status-EM_MANUTENCAO   { background: #ede9fe; color: #6d28d9; }
        .status-FINALIZADA      { background: #dcfce7; color: #15803d; }
        .status-ENTREGUE        { background: #f1f5f9; color: #475569; }

        /* TABELA */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
        }

        .table {
            margin: 0;
        }

        .table thead th {
            background: #1f2937;
            color: #e5e7eb;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 14px 16px;
            border: none;
        }

        .table tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.1s;
        }

        .table tbody tr:hover {
            background: #f8fafc;
        }

        .table tbody td {
            padding: 13px 16px;
            vertical-align: middle;
            color: #374151;
            font-size: 0.9rem;
        }

        .numero-os {
            font-family: monospace;
            font-size: 0.82rem;
            color: #6b7280;
            background: #f3f4f6;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">
        <h4><i class="bi bi-gear-fill text-primary"></i> OS Manager</h4>
        <small>Gerenciamento de Serviços</small>
    </div>

    <nav>
        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/os" class="active"><i class="bi bi-clipboard-data"></i> Ordens de Serviço</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/equipamentos"><i class="bi bi-tools"></i> Equipamentos</a>
    </nav>

    <div class="sidebar-footer">
        <a href="/logout"><i class="bi bi-box-arrow-right"></i> Sair</a>
    </div>
</div>

<!-- CONTENT -->
<div class="content">

    <div class="page-header">
        <h3><i class="bi bi-clipboard-data me-2 text-primary"></i>Ordens de Serviço</h3>
        <a href="/os/nova" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Nova OS
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table">
                <thead>
                    <tr>
                        <th>Número OS</th>
                        <th>Cliente</th>
                        <th>Equipamento</th>
                        <th>Entrada</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>

                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(ordens)}">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="bi bi-clipboard-x"></i>
                                Nenhuma ordem de serviço cadastrada.
                            </div>
                        </td>
                    </tr>

                    <!-- Lista preenchida -->
                    <tr th:each="os : ${ordens}">
                        <td>
                            <span class="numero-os" th:text="${os.numeroOS}">OS-00000000-XXXX</span>
                        </td>
                        <td th:text="${os.cliente != null ? os.cliente.nome : '-'}">Cliente</td>
                        <td th:text="${os.equipamento != null ? os.equipamento.modelo : '-'}">Equipamento</td>
                        <td th:text="${#temporals.format(os.dataEntrada, 'dd/MM/yyyy')}">00/00/0000</td>

                        <td>
                            <span class="badge-status"
                                  th:classappend="'status-' + ${os.status}"
                                  th:text="${os.status}">
                            </span>
                        </td>

                        <td class="text-center">

                            <!-- Botão Editar -->
                            <a th:href="@{'/os/editar/' + ${os.id}}"
                               class="btn btn-sm btn-warning me-1"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <!-- ✅ Botão Excluir via POST (corrigido) -->
                            <form th:action="@{'/os/excluir/' + ${os.id}}"
                                  method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Deseja excluir a OS ' + this.dataset.numero + '?')"
                                  th:data-numero="${os.numeroOS}">
                                <button type="submit"
                                        class="btn btn-sm btn-danger"
                                        title="Excluir">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>

                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
