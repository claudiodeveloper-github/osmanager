<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço - OS Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 240px; height: 100vh; position: fixed; top: 0; left: 0; background: #1f2937; color: white; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 24px 20px 16px; border-bottom: 1px solid #374151; }
        .sidebar nav { flex: 1; padding: 12px 0; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 11px 20px; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
        .content { margin-left: 240px; padding: 32px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
        .badge-status { font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><h4><i class="bi bi-gear-fill text-primary"></i> OS Manager</h4></div>
    <nav>
        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/os" class="active"><i class="bi bi-clipboard-data"></i> Ordens de Serviço</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/equipamentos"><i class="bi bi-tools"></i> Equipamentos</a>
    </nav>
</div>

<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Ordens de Serviço</h3>
        <a href="/os/nova" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Nova OS</a>
    </div>

    <div class="card p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Nº OS</th>
                <th>Cliente</th>
                <th>Equipamento</th>
                <th>Status</th>
                <th>Valor</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(ordens)}">
                <td colspan="6" class="text-center py-4 text-muted">
                    Nenhuma Ordem de Serviço encontrada.
                </td>
            </tr>
            <tr th:each="ordem : ${ordens}">
                <td class="fw-bold text-primary" th:text="${'#' + ordem.id}"></td>
                <td th:text="${ordem.cliente != null ? ordem.cliente.nome : '-'}"></td>
                <td th:text="${ordem.equipamento != null ? ordem.equipamento.nome : '-'}"></td>
                <td><span class="badge bg-secondary badge-status" th:text="${ordem.status}"></span></td>
                <td th:text="${'R$ ' + #numbers.formatDecimal(ordem.valor ?: 0, 1, 2)}"></td>
                <td class="text-end">
                    <a th:href="@{/os/editar/{id}(id=${ordem.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>

                    <a th:href="@{/os/exportar/{id}(id=${ordem.id})}" class="btn btn-sm btn-outline-danger" title="Baixar PDF">
                        <i class="bi bi-file-earmark-pdf"></i>
                    </a>

                    <form th:action="@{/os/excluir/{id}(id=${ordem.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
