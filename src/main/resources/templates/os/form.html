<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário OS - OS Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1f2937;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 24px 20px 16px;
            border-bottom: 1px solid #374151;
        }

        .sidebar-brand h4 {
            color: #fff;
            font-weight: 700;
            margin: 0;
            font-size: 1.1rem;
        }

        .sidebar-brand small {
            color: #9ca3af;
            font-size: 0.72rem;
        }

        .sidebar nav {
            flex: 1;
            padding: 12px 0;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .sidebar a i {
            font-size: 1rem;
            width: 18px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #374151;
        }

        .sidebar-footer a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-footer a:hover {
            color: #ef4444;
        }

        /* CONTENT */
        .content {
            margin-left: 240px;
            padding: 28px 32px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h3 {
            font-weight: 700;
            color: #111827;
            font-size: 1.4rem;
            margin: 0;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
            max-width: 860px;
        }

        .card-header {
            border-radius: 12px 12px 0 0 !important;
            padding: 16px 24px;
        }

        .card-body {
            padding: 28px 24px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            padding: 9px 12px;
            color: #111827;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .section-divider {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9ca3af;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
            margin: 24px 0 16px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">
        <h4><i class="bi bi-gear-fill text-primary"></i> OS Manager</h4>
        <small>Gerenciamento de Serviços</small>
    </div>

    <nav>
        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/os" class="active"><i class="bi bi-clipboard-data"></i> Ordens de Serviço</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/equipamentos"><i class="bi bi-tools"></i> Equipamentos</a>
    </nav>

    <div class="sidebar-footer">
        <a href="/logout"><i class="bi bi-box-arrow-right"></i> Sair</a>
    </div>
</div>

<!-- CONTENT -->
<div class="content">

    <div class="page-header">
        <h3>
            <i class="bi bi-clipboard-plus me-2 text-primary"></i>
            <span th:text="${os.id == null ? 'Nova Ordem de Serviço' : 'Editar Ordem de Serviço'}">
                Nova Ordem de Serviço
            </span>
        </h3>
    </div>

    <div class="card">

        <div class="card-header bg-primary text-white">
            <h6 class="mb-0">
                <i class="bi bi-info-circle me-2"></i>
                <span th:text="${os.id == null ? 'Preencha os dados da nova OS' : 'Atualize os dados da OS'}"></span>
            </h6>
        </div>

        <div class="card-body">

            <!--
                ✅ CORREÇÃO 1: action dinâmica
                   - Nova OS  → POST /os
                   - Editar   → POST /os/atualizar
                ✅ CORREÇÃO 2: CSRF inserido automaticamente pelo Thymeleaf
            -->
            <form th:action="${os.id == null ? '/os' : '/os/atualizar'}"
                  method="post">

                <!-- Campo oculto para o ID (necessário na edição) -->
                <input type="hidden" th:if="${os.id != null}" name="id" th:value="${os.id}">

                <div class="section-divider">Vínculo</div>

                <div class="row g-3">

                    <!-- ✅ CORREÇÃO 3: th:value usa o ID, não o objeto inteiro -->
                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-person me-1"></i>Cliente
                        </label>
                        <select class="form-select" name="clienteId" required>
                            <option value="">Selecione o cliente...</option>
                            <option th:each="c : ${clientes}"
                                    th:value="${c.id}"
                                    th:text="${c.nome}"
                                    th:selected="${os.cliente != null && os.cliente.id == c.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-pc-display me-1"></i>Equipamento
                        </label>
                        <select class="form-select" name="equipamentoId" required>
                            <option value="">Selecione o equipamento...</option>
                            <option th:each="e : ${equipamentos}"
                                    th:value="${e.id}"
                                    th:text="${e.nome + ' — ' + e.modelo}"
                                    th:selected="${os.equipamento != null && os.equipamento.id == e.id}">
                            </option>
                        </select>
                    </div>

                </div>

                <div class="section-divider">Status e Valor</div>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-flag me-1"></i>Status
                        </label>
                        <select class="form-select" name="status">
                            <option th:each="s : ${statusList}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${os.status == s}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            <i class="bi bi-currency-dollar me-1"></i>Valor (R$)
                        </label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               class="form-control"
                               name="valor"
                               th:value="${os.valor}"
                               placeholder="0,00">
                    </div>

                </div>

                <div class="section-divider">Detalhes Técnicos</div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-chat-left-text me-1"></i>Observações
                    </label>
                    <textarea class="form-control"
                              name="observacoes"
                              rows="3"
                              placeholder="Descreva o problema relatado pelo cliente..."
                              th:text="${os.observacoes}">
                    </textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-file-earmark-text me-1"></i>Laudo Técnico
                    </label>
                    <textarea class="form-control"
                              name="laudoTecnico"
                              rows="3"
                              placeholder="Descreva o diagnóstico e serviço realizado..."
                              th:text="${os.laudoTecnico}">
                    </textarea>
                </div>

                <!-- AÇÕES -->
                <div class="d-flex justify-content-between">
                    <a href="/os" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle me-1"></i> Salvar
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
