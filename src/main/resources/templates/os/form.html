<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OS Manager - Ordem de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 240px; height: 100vh; position: fixed; background: #1f2937; color: white; }
        .content { margin-left: 240px; padding: 32px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <h4>OS Manager</h4>
    <nav class="nav flex-column mt-4">
        <a href="/os" class="nav-link text-white"><i class="bi bi-arrow-left"></i> Voltar</a>
    </nav>
</div>

<div class="content">
    <h3><span th:text="${os.id == null ? 'Nova OS' : 'Editar OS'}">OS</span></h3>
    <div class="card p-4">
        <form th:action="@{/os}" method="post" th:object="${os}">
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Cliente</label>
                    <select class="form-select" th:field="*{cliente.id}" required>
                        <option value="">Selecione...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Equipamento</label>
                    <select class="form-select" th:field="*{equipamento.id}" required>
                        <option value="">Selecione...</option>
                        <option th:each="e : ${equipamentos}" th:value="${e.id}" th:text="${e.nome + ' - ' + e.modelo}"></option>
                    </select>
                </div>
            </div>

            <div class="row g-3 mt-2">
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{valor}">
                </div>
            </div>

            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Salvar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
