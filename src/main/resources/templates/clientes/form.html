<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cliente - OS Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 240px; height: 100vh; position: fixed; top: 0; left: 0; background: #1f2937; color: white; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 24px 20px 16px; border-bottom: 1px solid #374151; }
        .sidebar-brand h4 { color: #fff; font-weight: 700; margin: 0; font-size: 1.1rem; }
        .sidebar nav { flex: 1; padding: 12px 0; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 11px 20px; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
        .content { margin-left: 240px; padding: 28px 32px; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); max-width: 860px; }
        .card-header { border-radius: 12px 12px 0 0 !important; padding: 16px 24px; }
        .card-body { padding: 28px 24px; }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #374151; margin-bottom: 6px; }
        .form-control { border-radius: 8px; border: 1px solid #d1d5db; font-size: 0.9rem; padding: 9px 12px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <h4><i class="bi bi-gear-fill text-primary"></i> OS Manager</h4>
    </div>
    <nav>
        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/os"><i class="bi bi-clipboard-data"></i> Ordens de Serviço</a>
        <a href="/clientes" class="active"><i class="bi bi-people"></i> Clientes</a>
        <a href="/equipamentos"><i class="bi bi-tools"></i> Equipamentos</a>
    </nav>
</div>

<div class="content">
    <div class="mb-4">
        <h3 style="font-weight: 700; color: #111827;">
            <i class="bi bi-person-plus me-2 text-primary"></i>
            <span th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}">Novo Cliente</span>
        </h3>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>Dados do Cliente</h6>
        </div>
        <div class="card-body">

            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="POST">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" th:field="*{nome}" required placeholder="Ex: João da Silva">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">CPF (Apenas números)</label>
                        <input type="text" class="form-control" th:field="*{cpf}" maxlength="11" required placeholder="Ex: 12345678901">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="Ex: joao@email.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Telefone</label>
                        <input type="text" class="form-control" th:field="*{telefone}" placeholder="Ex: 11999999999">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Endereço Completo</label>
                    <input type="text" class="form-control" th:field="*{endereco}" placeholder="Rua, Número, Bairro, Cidade">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/clientes" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i> Salvar</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
