<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipamentos - OS Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 240px; height: 100vh; position: fixed; top: 0; left: 0; background: #1f2937; color: white; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 24px 20px 16px; border-bottom: 1px solid #374151; }
        .sidebar-brand h4 { color: #fff; font-weight: 700; margin: 0; font-size: 1.1rem; }
        .sidebar nav { flex: 1; padding: 12px 0; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 11px 20px; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
        .content { margin-left: 240px; padding: 28px 32px; min-height: 100vh; }
        .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand"><h4><i class="bi bi-gear-fill text-primary"></i> OS Manager</h4></div>
    <nav>
        <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/os"><i class="bi bi-clipboard-data"></i> Ordens de Serviço</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/equipamentos" class="active"><i class="bi bi-tools"></i> Equipamentos</a>
    </nav>
</div>
<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="font-weight: 700; color: #111827;"><i class="bi bi-tools me-2 text-primary"></i>Equipamentos</h3>
        <a href="/equipamentos/novo" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Novo Equipamento</a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome/Tipo</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Cliente (Dono)</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(equipamentos)}">
                    <td colspan="6" class="text-center py-4 text-muted"><i class="bi bi-inbox fs-4 d-block mb-2"></i>Nenhum equipamento cadastrado.</td>
                </tr>
                <tr th:each="e : ${equipamentos}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.nome}" class="fw-bold"></td>
                    <td th:text="${e.marca}"></td>
                    <td th:text="${e.modelo}"></td>
                    <td th:text="${e.cliente != null ? e.cliente.nome : 'Sem Cliente'}"></td>
                    <td class="text-end">
                        <a th:href="@{/equipamentos/editar/{id}(id=${e.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/equipamentos/excluir/{id}(id=${e.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Excluir este equipamento?')"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
