<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formulário Equipamento - OS Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
    .sidebar { width: 240px; height: 100vh; position: fixed; top: 0; left: 0; background: #1f2937; color: white; display: flex; flex-direction: column; }
    .sidebar-brand { padding: 24px 20px 16px; border-bottom: 1px solid #374151; }
    .sidebar-brand h4 { color: #fff; font-weight: 700; margin: 0; font-size: 1.1rem; }
    .sidebar nav { flex: 1; padding: 12px 0; }
    .sidebar a { color: #cbd5e1; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 11px 20px; font-size: 0.9rem; }
    .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
    .content { margin-left: 240px; padding: 28px 32px; min-height: 100vh; }
    .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); max-width: 860px; }
    .card-header { border-radius: 12px 12px 0 0 !important; padding: 16px 24px; }
    .card-body { padding: 28px 24px; }
    .form-label { font-weight: 600; font-size: 0.85rem; color: #374151; margin-bottom: 6px; }
    .form-control, .form-select { border-radius: 8px; border: 1px solid #d1d5db; font-size: 0.9rem; padding: 9px 12px; }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><h4><i class="bi bi-gear-fill text-primary"></i> OS Manager</h4></div>
  <nav>
    <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/os"><i class="bi bi-clipboard-data"></i> Ordens de Serviço</a>
    <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
    <a href="/equipamentos" class="active"><i class="bi bi-tools"></i> Equipamentos</a>
  </nav>
</div>
<div class="content">
  <div class="mb-4">
    <h3 style="font-weight: 700; color: #111827;">
      <i class="bi bi-pc-display me-2 text-primary"></i>
      <span th:text="${equipamento.id == null ? 'Novo Equipamento' : 'Editar Equipamento'}"></span>
    </h3>
  </div>
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>Dados do Equipamento</h6>
    </div>
    <div class="card-body">
      <form th:action="@{/equipamentos/salvar}" th:object="${equipamento}" method="POST">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
          <label class="form-label">Vincular a um Cliente</label>
          <select class="form-select" th:field="*{cliente}" required>
            <option value="">Selecione o dono do equipamento...</option>
            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
          </select>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Tipo (Ex: Notebook)</label>
            <input type="text" class="form-control" th:field="*{nome}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Marca</label>
            <input type="text" class="form-control" th:field="*{marca}">
          </div>
          <div class="col-md-4">
            <label class="form-label">Modelo</label>
            <input type="text" class="form-control" th:field="*{modelo}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Número de Série</label>
          <input type="text" class="form-control" th:field="*{numeroSerie}">
        </div>

        <div class="mb-4">
          <label class="form-label">Defeito Relatado</label>
          <textarea class="form-control" th:field="*{defeito}" rows="3" placeholder="Descreva o problema inicial..."></textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <a href="/equipamentos" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
          <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
